name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rachai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rachai_test
      CORS_ORIGIN: http://localhost:5173
      JWT_SECRET: ci-only-secret-not-used-anywhere-else-1234
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: ci-only-password

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # Reports on production dependencies only — a dev-tool advisory doesn't
      # ship to users. Kept non-blocking on purpose: npm's audit endpoint is
      # being retired and answers with 400s and timeouts, and a build that goes
      # red on a registry hiccup just teaches you to ignore CI. Dependabot is
      # what actually watches for advisories here.
      - run: npm audit --omit=dev --audit-level=high
        continue-on-error: true
